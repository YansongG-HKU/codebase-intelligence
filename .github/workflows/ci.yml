name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: CLI smoke
        run: |
          cbi version
          cbi overview tests/fixtures/cli/demo_repo --json > /tmp/overview.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/overview.json", encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["budgets"]["tokensEstimated"] <= payload["budgets"]["maxTokens"]
          assert "fingerprint" in payload["index"]
          PY

  dsh-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/deepseek-harness/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: npm test
      - name: Python bridge smoke
        run: node verify/bridge-smoke.mjs
      - name: Token footprint
        run: npm run footprint
