name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Regenerate export snapshot
        run: cbi export .
      - name: Retrieval evaluation smoke
        run: python scripts/eval_retrieval.py --root tests/fixtures/retrieval/repo --k 1 3 5 --json-out /tmp/retrieval-evaluation.json
      - name: CLI smoke
        run: |
          cbi version
          cbi overview tests/fixtures/cli/demo_repo --json > /tmp/overview.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/overview.json", encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["budgets"]["tokensEstimated"] <= payload["budgets"]["maxTokens"]
          assert "fingerprint" in payload["index"]
          PY

  clean-checkout:
    name: clean-checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fixtures, deterministic snapshot and CLI
        run: |
          pytest
          cbi export .
          cbi overview tests/fixtures/cli/demo_repo --json > /tmp/overview.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/overview.json").read_text(encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["budgets"]["tokensEstimated"] <= payload["budgets"]["maxTokens"]
          assert "fingerprint" in payload["index"]
          PY
      - name: Plugin package installation chain
        working-directory: integrations/deepseek-harness/plugin
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/cbi-pack.json"
          PACKAGE="$RUNNER_TEMP/$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/cbi-pack.json"))[0]["filename"])')"
          mkdir -p "$RUNNER_TEMP/cbi-plugin-install"
          cd "$RUNNER_TEMP/cbi-plugin-install"
          npm init --yes >/dev/null
          npm install --no-package-lock --ignore-scripts "$PACKAGE"
          node -e "const assert=require('node:assert'); const fs=require('node:fs'); const path=require('node:path'); const pkg=require('dsh-codebase-intelligence/package.json'); assert.equal(pkg.name,'dsh-codebase-intelligence'); const root=path.dirname(require.resolve('dsh-codebase-intelligence')); for (const f of ['client.js','cordis.patch.yml','locale/zh.json']) assert.ok(fs.existsSync(path.join(root,f)), f); console.log('plugin package installed', pkg.name, pkg.version)"
      - name: Plugin gates on the clean checkout
        working-directory: integrations/deepseek-harness/plugin
        run: |
          npm run check
          npm test
          npm run smoke
          npm run footprint
      - name: Commit refreshed generated snapshot to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/codebase-intelligence; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/codebase-intelligence
            git commit -m "chore: refresh generated codebase snapshot"
            git push
          fi
      - name: No generated drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  dsh-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/deepseek-harness/plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Unit tests
        run: npm test
      - name: Python bridge smoke
        run: node verify/bridge-smoke.mjs
      - name: Token footprint
        run: npm run footprint
